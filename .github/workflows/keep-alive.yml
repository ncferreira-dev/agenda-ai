# Keep-alive do backend no Render (plano free).
#
# O problema: o Render free DERRUBA o servico apos ~15 min sem requisicao e leva
# ~50s pra acordar na proxima. Dois efeitos ruins:
#   1. O cliente que abre a pagina de agendamento espera ~50s na primeira vez.
#   2. Pior: os crons de lembrete/resumo/follow-up rodam DENTRO deste processo
#      (@nestjs/schedule). Servidor dormindo = processo morto = lembrete NAO
#      enviado. Ou seja, o recurso que o dono paga pra ter nao dispara enquanto
#      ninguem acessa o site.
#
# A solucao: este workflow pinga GET /health a cada 10 min, mantendo o processo
# vivo. O /health nao tem auth nem toca no banco (src/health/health.controller.ts).
# Repositorio publico tem minutos de Actions ILIMITADOS, entao custa R$ 0.
#
# Por que 10 min e nao 14: o agendador do GitHub atrasa sob carga; a margem ate
# os 15 min do Render cobre esses atrasos.
#
# CONFIGURAR (uma vez, opcional): em Settings > Secrets and variables > Actions >
# Variables, crie a variavel KEEPALIVE_URL com a URL publica da API + /health
# (a mesma PUBLIC_API_URL do dashboard do Render). Sem a variavel, usa o padrao
# abaixo. Se a URL do seu servico for outra, defina a variavel — o job falha e
# avisa por e-mail se o /health nao responder 200.

name: Keep-alive (Render)

on:
  schedule:
    - cron: '*/10 * * * *' # a cada 10 minutos
  workflow_dispatch: {} # botao "Run workflow" pra testar na mao

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Pingar /health
        env:
          URL: ${{ vars.KEEPALIVE_URL || 'https://agendai-api.onrender.com/health' }}
        run: |
          set -euo pipefail
          echo "Pingando: $URL"
          # --max-time 80 cobre o cold start de ~50s do Render sem travar pra
          # sempre. --retry pega o 502 que o Render devolve enquanto sobe.
          codigo=$(curl -sS -o /dev/null -w '%{http_code}' \
            --max-time 80 --retry 3 --retry-delay 10 --retry-all-errors "$URL")
          echo "HTTP $codigo"
          if [ "$codigo" != "200" ]; then
            echo "ERRO: /health nao respondeu 200 (veio $codigo)."
            echo "Confira a variavel KEEPALIVE_URL do repositorio."
            exit 1
          fi
          echo "OK: backend acordado."
