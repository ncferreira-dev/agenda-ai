# Checagem automática a cada push. Objetivo: não deixar código quebrado chegar
# em produção — o deploy é automático, então um push com erro vai direto pro ar.
#
# UM passo só, de propósito: `npm run verificar`, o MESMO comando que se roda na
# máquina antes de entregar. A versão anterior deste arquivo listava os testes um
# a um, sete passos escritos à mão, e foi assim que a suíte do token de acesso do
# cliente entrou no repositório sem entrar no CI: lista escrita é lista que
# apodrece. O verificador PROCURA o que rodar, então suíte nova entra sozinha.
#
# Se este arquivo e o verificador discordarem um dia, o errado é este arquivo.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  verificar:
    name: Verificador de entrega
    runs-on: ubuntu-latest

    # Postgres de verdade: os testes de integração provam o anti-overbooking, e
    # a garantia mora numa exclusion constraint gist do banco. Sem Postgres no
    # CI, a única prova de que dois clientes não caem no mesmo horário some — e
    # o verde passaria a significar menos do que parece.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agenda
          POSTGRES_PASSWORD: agenda
          POSTGRES_DB: agenda
        ports:
          - 5432:5432
        # Sem o health check o job começa antes de o banco aceitar conexão.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # O script do banco de teste deriva daqui trocando o nome por agenda_teste.
      DATABASE_URL: postgresql://agenda:agenda@localhost:5432/agenda
      # A app recusa subir sem estes; o teste de integração instancia o service.
      JWT_SECRET: ci-nao-e-segredo-de-producao
      CPF_HASH_SECRET: ci-nao-e-segredo-de-producao

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Instalar dependências (api)
        run: npm ci

      - name: Instalar dependências (web)
        # O verificador roda typecheck e lint dentro de web/, então as
        # dependências de lá precisam existir antes dele começar.
        run: npm ci --prefix web

      - name: Cliente psql (o preparo do banco de teste usa)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Gerar o Prisma Client
        # Os tipos do banco vêm daqui; sem isso a checagem de tipos falha.
        run: npx prisma generate

      - name: Verificar
        run: npm run verificar
