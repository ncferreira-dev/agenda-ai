# Blueprint do Render: cria o backend (Docker) + um Postgres e liga tudo sozinho.
# O Render gera JWT_SECRET/CPF_HASH_SECRET (generateValue) e injeta a DATABASE_URL
# do banco criado. WEB_ORIGIN começa com placeholder e é trocado pela URL da Vercel.
# As migrations rodam no start (docker-entrypoint.sh -> prisma migrate deploy).
databases:
  - name: agendai-db
    plan: free
    databaseName: agenda
    user: agenda

services:
  - type: web
    name: agendai-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agendai-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CPF_HASH_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      # Trocado pela URL real da Vercel depois (libera o navegador a chamar a API).
      - key: WEB_ORIGIN
        value: https://placeholder.vercel.app
      # URL pública desta própria API no Render (ex.: https://agendai-api.onrender.com).
      # Obrigatória em produção quando o Google está configurado (vira o callback do OAuth).
      - key: PUBLIC_API_URL
        sync: false
      # Login social do dono — Google (opcional). Credenciais criadas em
      # console.cloud.google.com (OAuth 2.0, Aplicativo da Web). Redirect autorizado:
      #   <PUBLIC_API_URL>/auth/oauth/google/callback
      # sync: false = preenchido manualmente no dashboard do Render, nunca no git.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
