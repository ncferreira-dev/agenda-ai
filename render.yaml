# Blueprint do Render: cria o backend (Docker). O Postgres NÃO mora aqui — fica no
# Neon (externo), porque o banco free do Render expira em ~30 dias e derruba a API
# quando morre (aconteceu em 08/2026). A DATABASE_URL é preenchida à mão no
# dashboard; o Render gera JWT_SECRET/CPF_HASH_SECRET (generateValue).
# Este arquivo é a fonte da verdade pro Blueprint: qualquer edição manual de env var
# que também tenha valor aqui é sobrescrita a cada sync (deploy por push) — por isso
# a URL da Vercel fica fixada aqui e os segredos ficam como sync: false.
# As migrations rodam no start (docker-entrypoint.sh -> prisma migrate deploy).
services:
  - type: web
    name: agendai-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      # Postgres no Neon (console.neon.tech). Use a connection string DIRETA, não a
      # "-pooler": o pgbouncer do Neon quebra o `prisma migrate deploy` do entrypoint.
      # Precisa terminar em ?sslmode=require. sync: false = colada no dashboard.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CPF_HASH_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      # Origem pública do site na Vercel (pra onde o navegador volta após o OAuth
      # e o CORS libera). Se o domínio da Vercel mudar, atualiza aqui.
      - key: WEB_ORIGIN
        value: https://agenda-ai-alpha.vercel.app
      # URL pública desta própria API no Render (ex.: https://agendai-api.onrender.com).
      # Obrigatória em produção quando o Google está configurado (vira o callback do OAuth).
      - key: PUBLIC_API_URL
        sync: false
      # Login social do dono — Google (opcional). Credenciais criadas em
      # console.cloud.google.com (OAuth 2.0, Aplicativo da Web). Redirect autorizado:
      #   <PUBLIC_API_URL>/auth/oauth/google/callback
      # sync: false = preenchido manualmente no dashboard do Render, nunca no git.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Agente conversacional do WhatsApp. Sem a chave o app sobe normal e só o
      # agente responde "indisponível" — a página de agendamento não depende dela.
      - key: ANTHROPIC_API_KEY
        sync: false
      # WhatsApp Cloud API. Declaradas aqui (mesmo vazias no dashboard) pra que a
      # ausência seja VISÍVEL: sem isso elas não aparecem em lugar nenhum e o
      # esquecimento passa despercebido — que é justamente como um webhook fica
      # aberto sem ninguém notar.
      #   Webhook a cadastrar na Meta: <PUBLIC_API_URL>/webhook/whatsapp
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      # App Secret da Meta — valida a assinatura do webhook. Em produção a API
      # RECUSA o webhook enquanto estiver vazia (fail-closed, de propósito).
      - key: WHATSAPP_APP_SECRET
        sync: false
      # Templates aprovados na Meta pras mensagens iniciadas pelo negócio (lembrete
      # e follow-up), que saem fora da janela de 24h. Sem eles, os crons não
      # enviam pra valer (texto livre é recusado). Preencha no dashboard.
      - key: WHATSAPP_TEMPLATE_LEMBRETE
        sync: false
      - key: WHATSAPP_TEMPLATE_FOLLOWUP
        sync: false
      - key: WHATSAPP_TEMPLATE_LANG
        sync: false
