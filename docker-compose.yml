# Postgres local pra desenvolvimento. Sobe com: docker compose up -d
# Casa com a DATABASE_URL do .env.example.
services:
  db:
    image: postgres:16
    container_name: agenda-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: agenda
      POSTGRES_PASSWORD: agenda
      POSTGRES_DB: agenda
    ports:
      - '5432:5432'
    volumes:
      - agenda-pgdata:/var/lib/postgresql/data

volumes:
  agenda-pgdata:
